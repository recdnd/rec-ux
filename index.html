<!DOCTYPE html>

<head>

<body>
<!-- 2026-10-30 重做骨架(主筆: 風格對齊 rec.ooo/band, 背景簡潔, 照前端契約; 之後一支一支補 15 秒影片).
     版面照 band: 左 = 舞台(band 的封面位 -> 16:10 影片), 右 = 板塊與事例條(band 的曲目條) + 說明(band 的歌詞位).
     資料 data/cases.json, 影片 movies/<id>.mp4; video 為 null 時舞台是空框. 舊版(spiral.rec.ooo)= main 分支的 portfolio.css / portfolio.js. -->
<nav id="tools">
  <a id="go" href="#" target="_blank" rel="noopener" aria-label="open product">↗</a>
  <a href="https://rec.ooo/" aria-label="rec.ooo">🏠</a>
</nav>
<main>
  <section id="stage"><video id="vid" muted loop playsinline preload="metadata"></video></section>
  <aside id="side">
    <div id="list"></div>
    <article id="detail">
      <p id="t"></p>
      <p id="line"></p>
      <dl>
        <dt>Problem</dt><dd id="problem"></dd>
        <dt>Design</dt><dd id="move"></dd>
        <dt>Outcome</dt><dd id="outcome"></dd>
      </dl>
      <p id="role"></p>
    </article>
  </aside>
</main>
<script src="js/ux.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Rec</title>
<link rel="canonical" href="https://p.rec.ooo/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<!-- p.rec.ooo 根頁(2026-11-05): 名字和 rec.ooo. 2026-11-08 主筆加 resume/(通用版, 「別人來找」的入口; 其他版本照舊不列). 樣式照 rec.ooo/band 的前端契約: 系統黑字, 連結系統藍, 底色框 .07 / .14 / .22. -->
<style>
:root{ --ink:#000; --op:#0000ff; --bg:#fff; --font: ui-monospace,"SF Mono",Menlo,"Courier New","Hiragino Sans","PingFang TC",monospace; }
html{ background:var(--bg); }
html,body{ margin:0; padding:0; color:var(--ink); }
body{ font:12px/1.35 var(--font); padding:4px; min-height:100vh; display:flex; align-items:center; justify-content:center; box-sizing:border-box; }
main{ display:flex; flex-direction:column; align-items:center; gap:4px; }
p{ margin:0; }
a{ color:var(--op); text-decoration:none; padding:1px; background:rgba(0,0,255,.07); }
a:hover,a:focus-visible{ background:rgba(0,0,255,.14); }
a:active{ background:rgba(0,0,255,.22); }
</style>
</head>
<body>
<main>
  <p>Rec</p>
  <p><a href="https://rec.ooo/">https://rec.ooo</a></p>
  <p><a href="resume/">resume</a></p>
</main>
</body>
</html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="UX case studies by Rec: sus dungeons, the Rec Dungeons music site, rec.ooo, kiln and Ruvia.">

  <meta property="og:title" content="Rec UX">
  <meta property="og:description" content="UX case studies by Rec: sus dungeons, the Rec Dungeons music site, rec.ooo, kiln and Ruvia.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://spiral.rec.ooo/">
  <meta property="og:site_name" content="Rec UX">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Rec UX",
    "url": "https://spiral.rec.ooo/",
    "description": "UX case studies by Rec: sus dungeons, the Rec Dungeons music site, rec.ooo, kiln and Ruvia.",
    "inLanguage": "en",
    "author": {
      "@type": "Person",
      "name": "Rec",
      "url": "https://rec.ooo/"
    }
  }
  </script>
  <link rel="icon" type="image/png" href="uxrec32.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="uxrec32-light.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="uxrec32.png">
  <link rel="stylesheet" href="css/portfolio.css?v=20261020e">
</head>
<body>
  <div class="rec-util" aria-label="Page utilities">
    <a class="rec-util__btn" href="https://rec.ooo/" title="rec.ooo" aria-label="rec.ooo">🏠</a>
    <button type="button" id="rec-invert-toggle" class="rec-util__btn" aria-pressed="false">🌑</button>
  </div>

  <div class="rec-root">
    <div class="rec-layout">
      <div class="rec-rail" id="rec-rail" role="list" aria-label="Selected work"></div>

      <div class="rec-dock" id="rec-dock" data-expanded="false">
        <button
          type="button"
          class="rec-dock__backdrop"
          id="rec-dock-backdrop"
          aria-label="Close preview"
          tabindex="-1"></button>
        <aside class="rec-stage" aria-label="Preview">
          <div
            class="rec-display"
            id="rec-display"
            role="button"
            tabindex="0"
            data-idle="true"
            aria-label="Preview monitor. Use play on a case to start."
          >
            <button
              type="button"
              class="rec-display__signal"
              id="rec-display-signal"
              aria-label="Video signal"
              title=""
              disabled></button>
            <div class="rec-display__viewport">
              <div class="rec-display__inner">
                <video
                  class="rec-display__video"
                  muted
                  playsinline
                  webkit-playsinline
                  preload="auto"
                  hidden></video>
                <img class="rec-display__image" alt="" hidden decoding="async" />
                <div class="rec-display__placeholder" hidden>
                  <p class="rec-display__placeholder-text"></p>
                </div>
              </div>
            </div>
            <div class="rec-display__caption"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>


  <script src="js/portfolio.js?v=20261020e"></script>
</body>
</html>

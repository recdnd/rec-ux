<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Rec versions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<!-- p.rec.ooo/versions(主筆 2026-11-05「做一個p.rec/admin 裡面顯示各種作品集列表（直接點就跳過去」; 2026-11-08「p-rec/versions做成所有存在的作品集/簡歷等的版本列表集，點擊就新頁跳轉」-> 從 /admin 改名, /admin 留轉址).
     一行 = 一個版本(作品集 / 簡歷 / 画庫), 整行可按, 開新分頁. 清單 = versions.json(公開). 每個 p.rec.ooo 版本的產品數 / 則數從它自己的 data/*.json 現數.
     給哪一家: names.json(本機才有, .gitignore, tools/versions_names.py 從 b-rec 🎀 專案開發書/p-rec/05 的對照表產生). repo 是 Public, 線上沒有這個檔, 就只顯示內容.
     根頁不連到這裡, noindex. 樣式照 rec.ooo/band 的前端契約: 系統黑字, 連結系統藍, 底色框 .07 / .14 / .22, 無框無圓角, 內外距 <= 4px. -->
<style>
:root{ --ink:#000; --op:#0000ff; --bg:#fff; --k:5,5,5; --font: ui-monospace,"SF Mono",Menlo,"Courier New","Hiragino Sans","PingFang TC",monospace; }
*{ box-sizing:border-box; }
html{ background:var(--bg); }
html,body{ margin:0; padding:0; color:var(--ink); }
body{ font:12px/1.35 var(--font); padding:4px; min-height:100vh; display:flex; align-items:center; justify-content:center; }
main{ width:min(640px, 100%); display:flex; flex-direction:column; gap:4px; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
#tools{ position:fixed; top:4px; right:4px; }
#tools a{ padding:1px 3px; }
#tools a:hover,#tools a:focus-visible{ background:rgba(var(--k),.10); }
.h{ display:flex; gap:4px; }
.h .k{ margin-left:auto; }
#list{ display:flex; flex-direction:column; gap:1px; }
/* 一行: 網址(系統藍)+ 名字 + 數量 / 說明一行(.55). 給哪一家靠右 */
.v{ display:flex; flex-direction:column; gap:1px; padding:2px; background:rgba(0,0,255,.07); }
.v:hover,.v:focus-visible{ background:rgba(0,0,255,.14); outline:none; }
.v:active{ background:rgba(0,0,255,.22); }
.v .r{ display:flex; gap:4px; align-items:baseline; }
.v .u{ color:var(--op); white-space:nowrap; }
.v .m,.v .c{ white-space:nowrap; }
.v .w{ margin-left:auto; text-align:right; min-width:0; }
.k,.v .n,.v .c{ opacity:.55; }
@media (max-width:520px){ .v .r{ flex-wrap:wrap; } .v .w{ margin-left:0; } }
</style>
</head>
<body>
<nav id="tools"><a href="https://rec.ooo/" aria-label="rec.ooo">🏠</a></nav>
<main>
  <div class="h"><p>versions</p><p class="k" id="cnt"></p></div>
  <div id="list"></div>
</main>
<script>
(async () => {
  const j = (u) => fetch(u, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const [vs, names] = await Promise.all([j("versions.json"), j("names.json")]);
  const list = document.getElementById("list");
  const root = new URL("../", location.href);   // versions/ 的上一層 = 站根(掛在哪都能動)
  document.getElementById("cnt").textContent = (vs || []).length + " 個";
  for (const v of vs || []) {
    const href = v.url || new URL(v.path, root).href;
    const a = document.createElement("a");
    a.className = "v"; a.href = href; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<span class="r"><span class="u"></span><span class="m"></span><span class="c"></span><span class="w"></span></span><span class="n"></span>`;
    a.querySelector(".u").textContent = href.replace(/^https?:\/\//, "");
    a.querySelector(".m").textContent = v.name;
    a.querySelector(".n").textContent = v.note || "";
    const who = names && names[v.path || v.url];
    if (who) a.querySelector(".w").textContent = who;
    list.appendChild(a);
    // 數量: 那一版自己的資料現數
    const base = new URL(v.path || "", root).href;
    if (v.data === "pd") {
      const [p, c] = await Promise.all([j(base + "data/products.json"), j(base + "data/cases.json")]);
      if (p && c) a.querySelector(".c").textContent = `產品 ${p.filter((x) => !x.group && x.issue).length} / 決定 ${c.filter((x) => x.type !== "note").length}`;
    } else if (v.data === "ux") {
      const [b, c] = await Promise.all([j(base + "data/boards.json"), j(base + "data/cases.json")]);
      if (b && c) a.querySelector(".c").textContent = `板塊 ${b.length} / 事例 ${c.length}`;
    }
  }
})();
</script>
</body>
</html>

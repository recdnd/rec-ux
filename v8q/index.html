<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 掛在哪個子路徑都能動: 不寫死網域或根路徑, 全部相對路徑.
     沒有結尾斜線的網址會讓相對路徑解到上一層, 所以第一件事照現在的網址補一個 <base>(不是寫死的路徑). -->
<script>(function(){var p=location.pathname;if(!/\/$/.test(p))p=/\.html?$/.test(p)?p.replace(/[^\/]*$/,""):p+"/";var b=document.createElement("base");b.href=p;document.head.appendChild(b);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Rec Product Design</title>
<meta name="description" content="Rec のプロダクトデザイン。音楽サイト、イラストのギャラリー、ブラウザゲームなどで、誰の何の課題に、何を検討して何を決めたか。">
<link rel="canonical" href="https://p.rec.ooo/v8q/">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<link rel="stylesheet" href="pd.css?v=20261106a">
</head>
<body>
<!-- Rec Product Design(2026-11-05). 左 = 舞台, 右 = 列表 + 說明.
     產品名那一條 = プロダクト層(課題 / 提供 / 運営 / 体制), 一則 = 一個決定(課題 / 検討 / 決定 / 確認 / 次).
     文案 data/products.json + data/cases.json. 舞台四種: 影片(movies/)/ 真頁面(iframe)/ 截圖(img/)/ 示意圖(下面的 <template id="fig-...">). -->
<nav id="tools">
  <a href="https://rec.ooo/" aria-label="rec.ooo">🏠</a>
</nav>
<main>
  <section id="stage">
    <video id="vid" muted loop playsinline preload="metadata"></video>
    <iframe id="live" hidden aria-label="live page"></iframe>
    <figure id="pic" hidden><img alt=""><figcaption></figcaption></figure>
    <div id="fig" hidden></div>
  </section>
  <aside id="side">
    <p id="guide">各事例は、課題 → 検討 → 決定 → 確認 の順で書いています。</p>
    <div id="list"></div>
    <article id="detail">
      <p id="t"></p>
      <p id="line"></p>
      <dl id="dl"></dl>
      <p id="role"></p>
      <div id="code" hidden><button id="code-t" type="button" aria-expanded="false"></button><div id="code-b" hidden></div></div>
    </article>
  </aside>
</main>

<!-- 示意圖. 字是素材原文, 改字先改素材再改這裡 -->
<template id="fig-offer">
  <h3>導入する企業が気にすることから、提供のしかたを決める（販売開始前）</h3>
  <table class="tb">
    <thead><tr><th>導入する企業が気にすること</th><th>Cloutric での設計</th></tr></thead>
    <tbody>
      <tr><td>数字を社外に出したくない</td><td>自社のサーバーで Docker で動く。データは自社の1つのフォルダにだけあり、外部への通信はない。提供する自分も、どの会社の数字にも触れない。</td></tr>
      <tr><td>導入と更新の手間</td><td>インストールも更新も1行。更新時のデータベース移行に失敗したら自動で元に戻し、更新前のバックアップを残す。</td></tr>
      <tr><td>料金と人数</td><td>¥9,800 の一回払い、全社で人数無制限、1年分の更新つき。その1年に出た版は、期限後もずっと使える。</td></tr>
      <tr><td>やめるとき・ほかのツールへ移るとき</td><td>契約の状態に関係なく、閲覧と書き出しは止めない。書き出しは1つの ZIP に、全データの JSON、Excel で開ける CSV、ほかの予実・BI ツールが読める縦持ちの CSV、データベース本体をまとめる。取り込みは Excel から書き出した CSV（Shift_JIS）をそのまま読める。</td></tr>
      <tr><td>試すまでのハードル</td><td>cloutric.com のデモをそのまま触れる。インストール後30日はライセンスキーなしで使える。</td></tr>
    </tbody>
  </table>
</template>

<template id="fig-om">
  <h3>Cloutric のオブジェクトモデル（画面から書き起こし）</h3>
  <div class="om">
    <div class="objs">
      <div class="o"><b>施策</b><p>ID / 施策名 / 部門 / 担当 / ステータス / 工数（実績・予定）/ 原価差異 / 期限</p><p class="a">新規作成</p></div>
      <div class="o on"><b>アラート</b><p>部門 / 勘定科目 / 差異</p><p class="a">なし。見るだけ。届け先は通知ルールで決める</p></div>
      <div class="o"><b>通知ルール</b><p>アラートの種類 / 届け先チャンネル / 担当者メンション / 現在の該当数</p><p class="a">届け先を選ぶ / Slack・Teams・メールにつなぐ</p></div>
      <div class="o"><b>チャンネル</b><p>名前 / 公開・非公開</p><p class="a">メッセージを送る / @メンション</p></div>
      <div class="o"><b>メンバー</b><p>名前 / 役職</p><p class="a">DMを送る</p></div>
      <p class="rel">関係：部門 1:n 施策（親子）/ メンバー 1:n 施策（担当として参照）/ 通知ルール → チャンネル・メンバー（参照）/ アラート → 部門・勘定科目（参照）。上段はプロパティ、青字はアクション。閲覧は操作に数えない。</p>
    </div>
    <figure class="shot"><img src="img/cloutric-rules.jpg" alt="Cloutric の通知ルールの画面"><figcaption>通知ルールの画面。どのルールにも、今の該当数（現在 3 件 など）が出る。</figcaption></figure>
  </div>
</template>

<template id="fig-layers">
  <h3>ハード層とソフト層</h3>
  <div class="lay">
    <div class="hard"><b>ハード層</b><p>性別や学歴のように変わらない事実。書き換えずに写すだけ。</p></div>
    <div><b>ソフト層</b><p>自己PRのように、相手に合わせて毎回書くもの。ハード層とは混ぜない。</p></div>
  </div>
  <p class="cap"><b>分けた理由</b>混ぜると、事実のほうが言い回しに引っぱられて、少しずつずれていく。</p>
  <p class="cap">性別や国籍は、聞かれたときだけ出す。</p>
</template>

<template id="fig-fields">
  <h3>入力する側から見えたこと</h3>
  <table class="tb">
    <thead><tr><th>欄</th><th>会社ごとの違い</th></tr></thead>
    <tbody>
      <tr><td>電話番号</td><td>1つの欄でハイフンの有無を指定する会社と、3つの欄に分ける会社がある。3つの欄は組として読み取り、前・中・後に分けて入れる。</td></tr>
      <tr><td>住所・氏名</td><td>郵便番号の上3桁と下4桁、都道府県から番地までの分け方、全角の指定、氏名のカナ・ひらがな・ローマ字。同じ値を何通りもの形で持っておく必要がある。</td></tr>
      <tr><td>年月</td><td>「2023年4月」「2023年04月」「2023/04」と、欄ごとに書式が違う。</td></tr>
    </tbody>
  </table>
</template>

<template id="fig-pdir">
  <h3>埋める前に決めてあること</h3>
  <b>触らないもの</b>
  <table class="tb">
    <tr><td>送信・次のページ・ログイン・認証コード</td><td>押さない、進めない、解かない。最後のひと押しは必ず自分がする。</td></tr>
    <tr><td>パスワード欄</td><td>読まず、覚えさせる対象にも入れない。カーソルが入ると、画面の小さなキャラクターが目を覆う顔になる。</td></tr>
  </table>
  <b>埋め方の三つの決まり</b>
  <table class="tb">
    <tr><th>決まり</th><th>中身</th></tr>
    <tr><td>確かでなければ埋めない</td><td>読み取れなかった欄には候補を出さず、一括入力にも入れない。間違えて埋める損は、空けておく損より必ず大きい。</td></tr>
    <tr><td>自分で直した値が先</td><td>自分の手で直して覚えさせた値 ＞ 住所・電話の組からの推定 ＞ 原本の候補。サイトごとに覚えた値は、どの推定よりも強い。</td></tr>
    <tr><td>組は全部わかったときだけ</td><td>住所と電話は組として読む。決まった並びの形（住所は T1〜T6）に当てはまらず、一欄でもわからなければ、組ごと埋めずにコピー用に回す。</td></tr>
  </table>
  <p class="cap">候補には出どころと確かさを必ず添え、黙って差し替えない。下のコード枠は、この優先順位を決めている実物の部分。</p>
</template>

<template id="fig-team">
  <h3>どの工程を、だれが持つか</h3>
  <table class="tb">
    <tr><th>工程</th><th>担当</th><th>どう渡すか / どう確かめるか</th></tr>
    <tr><td>企画・仕様書・タスク指示書</td><td>自分</td><td>ナレッジベースに書き、作業の前にエージェントへ読ませる</td></tr>
    <tr><td>実装</td><td>AI エージェント</td><td>規約と手順書を読んでから着手。出力は自分が読んで直し、採否を決めて統合する</td></tr>
    <tr><td>検査</td><td>自動</td><td>編集のたび・作業の終わり・公開の前に走る（進め方の 2「AI の使い方」）</td></tr>
    <tr><td>絵・ジャケット・ロゴ</td><td>自分</td><td>すべて手描き。ジャケットは 32 枚描いて 14 枚に絞った</td></tr>
    <tr><td>遊んで確かめる</td><td>友人の内部テスター・自動プレイヤー</td><td>止まった場所と理由を聞いて設計に戻す。自動プレイヤーで最後まで進めるかを見る</td></tr>
    <tr><td>インターン（2026年10月、2日間）</td><td>1人のプロダクトエンジニア</td><td>本番相当のECサービスで、変更ごとに前後の数値を社員の方に報告した</td></tr>
  </table>
  <p class="cap">これまでの制作は主に個人。人と分担するときと同じく、仕様書・規約・検査で、分担の範囲と品質を揃えている。</p>
</template>
<template id="fig-ai">
  <h3>AI に任せる前と後に、何が走るか</h3>
  <div class="flow">
    <div class="me"><b>1 作業の前</b><p>共通の規約（デザイン・文章・記録の書き方）を自動で読み込む。作業の種類ごとの手順書 40 本から、該当する一本を読ませる</p></div>
    <i>→</i>
    <div><b>2 編集のたび</b><p>画面のファイルが変わると、枠線・角丸・影・アニメーション・4px を超える余白・規定外の文字色を数える。目標はすべて 0 件</p></div>
    <i>→</i>
    <div><b>3 終わる前</b><p>ファイルを変えたのにナレッジベースへの記録がなければ、作業の終了を一度止めて記録を求める</p></div>
    <i>→</i>
    <div class="me"><b>4 公開の前</b><p>事例文の字数の上限、中身のない言い回し、鉤括弧の中が出典にあるかを確かめる。✗ が一つでもあれば公開できない</p></div>
  </div>
  <b>実際の例</b>
  <p>11月6日、禁止している中身のない言い回しを事例文にわざと一語入れて公開しようとすると、4 の検査が ✗ を出し、公開の操作が止まった。戻すと通ることも確かめた。</p>
  <b>使わない判断</b>
  <p>文章整形ツール kiln は、生成 AI に直させると内容まで変わるため、実行時には AI を使わず、同じ入力なら必ず同じ結果になるルール方式にした。</p>
</template>

<script src="pd.js?v=20261106b"></script>
</body>
</html>

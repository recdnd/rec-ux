<!-- 前端密碼框: 同 aeu(碼同 aeu, 鍵 p-rec.key, 過一次記住; ?k=碼 直接放行). 碼只在 rec.ooo 的 portfolio 那一條: 點了自動複製碼再開這頁(主筆 11-20「從recooo站才知道，自動複製進密碼」). -->
<style>html.lk body>*:not(#lk){display:none!important}#lk{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;width:96px;height:18px;box-sizing:border-box;padding:0 4px;border:1px solid #0000ff;background:transparent;outline:0;font:11px/16px ui-monospace,Menlo,monospace;letter-spacing:3px;color:#000;caret-color:#0000ff;border-radius:0}#lk.ng{border-color:#ff0000;caret-color:#ff0000}#lk:hover{background:rgba(0,0,255,.06)}</style>
<script>(function(){var H="7e48e31a8336e0d00c52af196e61d7dbcc4f23956ca66554093b59248f17d2e2",K="p-rec.key";
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function ok(){try{localStorage.setItem(K,H)}catch(e){}document.documentElement.classList.remove("lk");var g=document.getElementById("lk");if(g)g.remove();dispatchEvent(new Event("resize"))}
try{if(localStorage.getItem(K)===H)return}catch(e){}
document.documentElement.classList.add("lk");
var q=new URLSearchParams(location.search).get("k");
if(q)sha(q).then(function(h){if(h===H)ok()});
document.addEventListener("DOMContentLoaded",function(){if(!document.documentElement.classList.contains("lk"))return;
var i=document.createElement("input");i.id="lk";i.type="password";i.autocomplete="off";i.spellcheck=false;i.setAttribute("aria-label","key");
document.body.appendChild(i);setTimeout(function(){i.focus()},0);
i.addEventListener("keydown",function(e){if(e.key!=="Enter")return;sha(i.value).then(function(h){if(h===H)return ok();i.value="";i.classList.add("ng");setTimeout(function(){i.classList.remove("ng")},200)})})})})();</script>
